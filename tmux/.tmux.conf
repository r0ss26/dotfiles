# ── General ──────────────────────────────────────────────
set -g mouse on
set -g status-position top
# (Removed a `set-environment -g PATH` override that excluded /opt/homebrew/bin
#  — it hid brew tools and broke tpm. tmux now inherits your login shell's PATH.)

# ── Keybindings ──────────────────────────────────────────
# prefix + I  → install/update plugins via tpm
bind-key I run '~/.tmux/plugins/tpm/scripts/install_plugins.sh'
# prefix + k  → clear screen AND wipe scrollback (the true Cmd+K)
bind k send-keys C-l \; clear-history

# ── Plugins (managed by tpm) ─────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'dracula/tmux'

# Persist sessions: continuum auto-saves every 15 min and restores on start.
# Manual control still works: prefix + Ctrl-s (save), prefix + Ctrl-r (restore).
set -g @continuum-restore 'on'
# Clear every pane after a restore. Two reasons restored panes come up dirty:
# resurrect creates panes minimized then resizes them (p10k instant prompt
# leaves a stale duplicate after the reflow), and .envrc scripts print output
# that DIRENV_LOG_FORMAT can't silence. C-l is safe even if a shell is still
# initializing — zsh buffers it and clears once the prompt is up.
# (xargs, not a shell loop — tmux escapes `$` when the hook option is read
# back, which would break a loop variable at eval time)
set -g @resurrect-hook-post-restore-all 'sleep 1; tmux list-panes -a -F "#{pane_id}" | xargs -n1 -I{} tmux send-keys -t {} C-l; sleep 2; tmux list-panes -a -F "#{pane_id}" | xargs -n1 -I{} tmux clear-history -t {}'

# Dracula theme
set -g @dracula-plugins " "
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session

# Initialize tpm — keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'

# Pin the running command to the top border of each pane
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[reverse],} #{pane_index} #{pane_title} #[default]"
